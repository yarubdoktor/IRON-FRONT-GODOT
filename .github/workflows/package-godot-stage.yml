name: Package IRON-FRONT Godot Stage 01

on:
  push:
    branches: [godot-port]
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/package-godot-stage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: godot-port
      - name: Create clean Godot project ZIP
        run: |
          zip -r /tmp/IRON-FRONT-GODOT-STAGE-01.zip \
            project.godot scenes scripts assets README.md PORTING_PLAN.md GODOT_PORT_AUDIT.md .gitignore
          unzip -t /tmp/IRON-FRONT-GODOT-STAGE-01.zip
      - name: Upload importable Godot project
        uses: actions/upload-artifact@v4
        with:
          name: IRON-FRONT-GODOT-STAGE-01
          path: /tmp/IRON-FRONT-GODOT-STAGE-01.zip
          if-no-files-found: error
          retention-days: 30
