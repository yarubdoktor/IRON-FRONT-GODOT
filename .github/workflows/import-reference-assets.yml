name: Import IRON-FRONT GLB Assets

on:
  push:
    branches: [godot-port]
    paths:
      - "reference/**"
      - ".github/workflows/import-reference-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: godot-port
          fetch-depth: 0
      - name: Extract reusable GLB assets
        run: |
          mkdir -p /tmp/iron-front-reference assets/3d
          unzip -q reference/IRON-FRONT-0.16-MORE-MINES-SOURCE.zip -d /tmp/iron-front-reference
          cp -a /tmp/iron-front-reference/public/assets/3d/. assets/3d/
          echo "Imported $(find assets/3d -type f -name '*.glb' | wc -l) GLB files."
      - name: Commit imported assets to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/3d
          if git diff --cached --quiet; then
            echo "No asset changes."
          else
            git commit -m "assets: import reusable GLB models from web 0.16"
            git push origin HEAD:godot-port
          fi
