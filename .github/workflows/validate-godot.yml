name: Validate and Package Clean Godot Project

on:
  push:
    branches: [godot-rebuild, iron-ai-studio/audit-camera-touch]
  pull_request:
    branches: [godot-rebuild]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Launch main scene headlessly
        run: godot --headless --path . --quit-after 3

      - name: Run economy regression tests
        run: godot --headless --path . --script res://tests/test_economy_manager.gd

      - name: Run camera touch regression tests
        run: godot --headless --path . --script res://tests/test_camera_controller.gd

      - name: Run interaction multi-touch regression tests
        run: godot --headless --path . --script res://tests/test_interaction_controller.gd

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create clean project ZIP
        run: |
          zip -r IRON-FRONT-GODOT-CLEAN-START.zip \
            project.godot scenes scripts docs README.md .gitignore reference tests

      - name: Upload project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: IRON-FRONT-GODOT-CLEAN-START
          path: IRON-FRONT-GODOT-CLEAN-START.zip
          retention-days: 30
