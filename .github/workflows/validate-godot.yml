name: Validate and Package Clean Godot Project

on:
  push:
    branches: [godot-rebuild, iron-ai-studio/audit-camera-touch]
  pull_request:
    branches: [godot-rebuild]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false

      - name: Verify project manifest and required folders
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -d scripts
          test -d assets
          test -d tests
          echo "Godot project root verified"

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Launch main scene headlessly
        run: godot --headless --path . --quit-after 3

      - name: Run economy regression tests
        run: godot --headless --path . --script res://tests/test_economy_manager.gd

      - name: Run camera touch regression tests
        run: godot --headless --path . --script res://tests/test_camera_controller.gd

      - name: Run interaction multi-touch regression tests
        run: godot --headless --path . --script res://tests/test_interaction_controller.gd

      - name: Run persistence regression tests
        run: godot --headless --path . --script res://tests/test_persistence_manager.gd

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify packaged Godot project
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -d scripts
          test -d assets
          test -d tests

      - name: Upload Godot project files
        uses: actions/upload-artifact@v4
        with:
          name: IRON-FRONT-GODOT-PROJECT
          path: |
            project.godot
            scenes/
            scripts/
            assets/
            docs/
            README.md
            .gitignore
            reference/
            tests/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
