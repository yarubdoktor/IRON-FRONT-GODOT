name: Validate Clean Godot Project

on:
  push:
    branches: [godot-rebuild]
  pull_request:
    branches: [godot-rebuild]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Launch main scene headlessly
        run: godot --headless --path . --quit-after 3
